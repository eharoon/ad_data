# Linking rules for scripts/build_combined.py.
#
# STATUS: scaffold. The file, sheet, header row and ID column below describe
# what each file contains. The rules that decide how files link (id_format,
# each source's id_rule and timepoint, renames, roster, and which overlapping
# files to keep) are "TODO" until Ebrahim confirms them from the source-data
# inventory. A source with a TODO rule is skipped and listed in the QC report.
#
# Per-source fields
#   name          short label, used in the dictionary and QC report
#   file, sheet   location inside data_dir; header_row is 0-based
#   id_column     column holding the participant ID as written in this file
#   id_format     optional per-source override of the global id_format
#   id_rule       how the raw ID becomes the canonical participant_id:
#                   {type: as_is}                              use the value (numeric IDs are formatted with id_format)
#                   {type: regex, pattern: "M(\\d+)", group: 1} extract the number, then apply id_format
#                   {type: crosswalk, file:, sheet:, from:, to:} look the raw ID up in a linking table
#   timepoint     a fixed label (e.g. "baseline") or {column: <col>, map: {raw: label}}
#   prefix        prepended to every variable name from this source
#   rename        {original column: new name}; overrides prefix for that column
#   drop_columns  columns not carried into the combined table
#   table         output table name (default "combined"); a second cohort can go to its own table
#   recode        {column: {raw value: new value}}, e.g. to align sex codings
#   scale         {column: factor}, e.g. 1000 to turn ng/mL into pg/mL
#   on_duplicate  "error" (default: skip the source) or "first" (keep first row per key)
#   include       false leaves the source out entirely

data_dir: ../../01_Comb_folder   # relative to this file; override with --data-dir

# Python format string applied to the integer participant number, e.g.
# "MIDL{:03d}" -> MIDL007. A source can override it with its own id_format
# (e.g. a second cohort keyed PHE###).
id_format: TODO

# Source whose participants define the roster for the unmatched-ID check:
# one source name, or {table: source name} when there is more than one table.
roster: TODO

